{% extends "base.html" %}
{% block title %}{{ 'Реєстрація' if mode == 'register' else 'Вхід' }}{% endblock %}
{% block content %}
<div class="card narrow">
    <h2>{{ 'Реєстрація' if mode == 'register' else 'Вхід' }}</h2>
    <form method="POST">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <label>Нікнейм</label>
        <input type="text" name="username" required maxlength="24" autofocus>
        <label>Пароль</label>
        <input type="password" name="password" required>
        <button class="btn" type="submit">{{ 'Створити акаунт' if mode == 'register' else 'Увійти' }}</button>
    </form>
</div>
{% endblock %}
