<!DOCTYPE html>
<html>
<head>
    <title>ВолиньГаз - Онлайн Заява</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Форма подачі заяви</h1>
        <form method="POST">
            <label>ПІБ Споживача:</label>
            <input type="text" name="name" required placeholder="Іваненко Іван">
            <label>Особовий рахунок:</label>
            <input type="text" name="account" required placeholder="12003456">
            <label>Текст примітки / Запит:</label>
            <textarea name="note" rows="5" placeholder="Вкажіть коментар до заяви..."></textarea>
            <button type="submit">Надіслати заяву</button>
        </form>
    </div>
</body>
</html>
