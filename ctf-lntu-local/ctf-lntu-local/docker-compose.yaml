services:
  ctfd:
    image: ctfd/ctfd:latest
    user: root
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=2
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=false
    volumes:
      - ctfd_uploads:/var/uploads
    depends_on:
      - db
      - cache
    restart: always

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=ctfd
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=ctfd
      - MYSQL_DATABASE=ctfd
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  cache:
    image: redis:alpine
    restart: always

  # OpenVPN вмикається лише профілем "vpn" (./ctf.sh vpn-up). Спершу: ./ctf.sh vpn-init
  openvpn:
    image: kylemanna/openvpn
    container_name: openvpn
    profiles: ["vpn"]
    cap_add:
      - NET_ADMIN
    ports:
      - "1194:1194/udp"
    volumes:
      - ./openvpn-data/conf:/etc/openvpn
    restart: always

  flag1_ctf:  # 01. ВолиньГаз (SSTI)
    build:
      context: ./challenges
      dockerfile: flag1_ctf/Dockerfile
    ports:
      - "8081:5000"
    restart: always

  flag2_ctf:  # 02. ВолиньВода (IDOR)
    build:
      context: ./challenges
      dockerfile: flag2_ctf/Dockerfile
    ports:
      - "8082:5000"
    restart: always

  flag3_ctf:  # 03. XSS-блог + адмін-бот
    build:
      context: ./challenges
      dockerfile: flag3_ctf/Dockerfile
    ports:
      - "8083:5000"
    restart: always

  flag4_ctf:  # 04. Затвор (SQLi)
