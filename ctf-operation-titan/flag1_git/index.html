
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Titan Security Node</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --titan-blue: #63d8ff;
            --titan-muted: #9db0c7;
            --titan-panel: rgba(15, 29, 49, 0.82);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 10%, rgba(32, 99, 155, 0.4), transparent 34rem),
                linear-gradient(145deg, #07111f 0%, #0b182b 55%, #101d31 100%);
        }

        .shell {
            max-width: 960px;
        }

        .brand-mark {
            color: var(--titan-blue);
            letter-spacing: 0.2em;
            font-size: 0.75rem;
        }

        .panel {
            background: var(--titan-panel);
            border: 1px solid rgba(144, 196, 235, 0.18);
            box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(0.75rem);
        }

        .status-dot {
            width: 0.6rem;
            height: 0.6rem;
            background: #45e0a4;
            box-shadow: 0 0 0.75rem #45e0a4;
        }

        .muted {
            color: var(--titan-muted);
        }

        .metric {
            border-top: 1px solid rgba(144, 196, 235, 0.16);
        }
    </style>
</head>
<body class="text-light">
    <main class="container shell py-5">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <div class="brand-mark fw-semibold">TITAN // OPERATIONS</div>
            <div class="d-flex align-items-center gap-2 small muted">
                <span class="status-dot rounded-circle"></span>
                NODE ONLINE
            </div>
        </header>

        <section class="panel rounded-4 p-4 p-md-5">
            <div class="row align-items-center g-5">
                <div class="col-lg-7">
                            <p class="text-uppercase small fw-semibold brand-mark mb-3">Operations archive gateway</p>
                            <h1 class="display-4 fw-bold mb-3">Titan Archive Node</h1>
                    <p class="lead muted mb-4">
                                A protected incident archive for internal operations telemetry.
                    </p>
                    <div class="d-flex flex-wrap gap-2">
                        <span class="badge rounded-pill text-bg-primary px-3 py-2">ARCHIVE ONLINE</span>
                        <span class="badge rounded-pill text-bg-dark border border-secondary px-3 py-2">RETENTION 90D</span>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="bg-black bg-opacity-25 rounded-3 p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="small text-uppercase muted">Node status</span>
                            <span class="text-success small">Operational</span>
                        </div>
                        <div class="metric pt-3 mb-3">
                            <div class="d-flex justify-content-between small mb-2">
                                <span class="muted">Archive index</span>
                                <span>100%</span>
                            </div>
                            <div class="progress bg-secondary bg-opacity-25" role="progressbar" aria-label="Encryption core status" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-info" style="width: 100%"></div>
                            </div>
                        </div>
                        <div class="metric pt-3 d-flex justify-content-between small">
                            <span class="muted">Last diagnostic</span>
                            <span>Nominal</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="text-center small muted mt-4">
            Authorized personnel only · Titan Research Division
        </footer>
    </main>
</body>
</html>
