services:
  ctfd:
    image: ctfd/ctfd:3.7.7
    user: root
    ports: ["8000:8000"]
    environment:
      ULOGS: /var/log/CTFd
      DATABASE_URL: mysql+pymysql://ctfd:ctfd@db:3306/ctfd
      REDIS_URL: redis://cache:6379
      SECRET_KEY: titan_super_secret_key
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: unless-stopped
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ctfd
      MYSQL_USER: ctfd
      MYSQL_PASSWORD: ctfd
      MYSQL_DATABASE: ctfd
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uctfd -pctfd --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  cache:
    image: redis:alpine
    restart: unless-stopped
  ctfd_setup:
    build: ./ctfd-setup
    depends_on:
      ctfd:
        condition: service_started
    restart: "no"
  flag1_git:
    build: ./flag1_git
    ports: ["127.0.0.1:8001:80"]
    restart: unless-stopped
  flag2_jwt:
    build: ./flag2_jwt
    ports: ["8002:5000"]
    restart: unless-stopped
  flag3_lfsr:
    build: ./flag3_lfsr
    ports: ["8003:80"]
    restart: unless-stopped
  flag4_pickle:
    build: ./flag4_pickle
    ports: ["8004:5000"]
    restart: unless-stopped
  flag5_jwt_rsa:
    build: ./flag5_jwt_rsa
    ports: ["8005:5000"]
    restart: unless-stopped
  flag6_ecb:
    build: ./flag6_ecb
    ports: ["8006:5000"]
    restart: unless-stopped
  flag7_sqli:
    build: ./flag7_sqli
    ports: ["8007:5000"]
    restart: unless-stopped
  flag8_wiener:
    build: ./flag8_wiener
    ports: ["8008:80"]
    restart: unless-stopped
  flag9_stego:
    build: ./flag9_stego
    ports: ["8009:80"]
    restart: unless-stopped
  flag10_lfi:
    build: ./flag10_lfi
    ports: ["8010:5000"]
    restart: unless-stopped
volumes:
  db_data:
