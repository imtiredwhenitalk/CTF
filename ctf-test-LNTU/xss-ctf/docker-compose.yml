services:
  web:
    build: .
    container_name: nullbyte-xss
    ports:
      - "5000:5000"
    environment:
      # Порожнє значення = дефолтний флаг з app.py.
      CTF_FLAG: ${CTF_FLAG:-}
      # Порожнє значення = випадковий пароль на кожен запуск.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_BASE_URL: http://127.0.0.1:5000
      BOT_COOLDOWN: ${BOT_COOLDOWN:-10}
      BOT_VISIT_SECONDS: ${BOT_VISIT_SECONDS:-7}
    extra_hosts:
      # Щоб бот у контейнері діставав твій listener на хості (Linux і Docker Desktop).
      - "host.docker.internal:host-gateway"
    volumes:
      - forum-data:/srv/data
    restart: unless-stopped

volumes:
  forum-data:
