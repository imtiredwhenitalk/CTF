{% extends 'base.html' %}{% block content %}<div class="panel wide"><div class="eyebrow">СЛУЖБОВИЙ РОЗДІЛ</div><h1>Панель працівника</h1>{% if locked %}<p>Введіть службовий PIN для доступу до заявок.</p><form method="post"><label>PIN<input type="password" name="pin" required></label><button>Увійти</button></form>{% else %}<div class="table-wrap"><table><tr><th>№</th><th>Ім'я</th><th>Послуга</th><th>Статус</th></tr>{% for item in items %}<tr><td>{{item.id}}</td><td>{{item.name}}</td><td>{{item.service}}</td><td><form method="post" action="/admin/update/{{item.id}}"><select name="status">{% for s in ['Прийнята','В роботі','Виконана'] %}<option {% if item.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button>Зберегти</button></form></td></tr>{% endfor %}</table></div>{% endif %}</div>{% endblock %}
