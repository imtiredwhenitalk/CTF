# Operation Titan — challenge stack.
#
# The platform (CTFd, OpenVPN, VPN portal, watermark service) lives in
# ../CTFd and must be started first.  This file only builds the challenge
# containers and joins the external networks created by the platform.
#
#   ../CTFd/setup.sh          # platform first
#   ./setup.sh                # then this stack (wrapper does both)
services:
  flag1_ssti:
    build: ./flag1_ssti
    ports: ["8001:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.11
  flag2_jwt:
    build: ./flag2_jwt
    ports: ["8002:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.12
  flag3_lfsr:
    build: ./flag3_lfsr
    ports: ["8003:80"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.13
  flag4_pickle:
    build: ./flag4_pickle
    ports: ["8004:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.14
  flag5_jwt_rsa:
    build: ./flag5_jwt_rsa
    ports: ["8005:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.15
  flag6_ecb:
    build: ./flag6_ecb
    ports: ["8006:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.16
  flag7_sqli:
    build: ./flag7_sqli
    ports: ["8007:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.17
  flag8_wiener:
    build: ./flag8_wiener
    ports: ["8008:80"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.18
  flag9_stego:
    build: ./flag9_stego
    ports: ["8009:80"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.19
  flag10_lfi:
    build: ./flag10_lfi
    ports: ["8010:5000"]
    environment:
      - TITAN_WATERMARK_URL=http://watermark:5060
      - TITAN_CHALLENGE_ID=lfi_challenge
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.20
      titan_internal: {}
  flag11_binance:
    build: ./flag11_binance/intro
    ports: ["8011:80"]
    depends_on:
      - flag11_binance_api
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.21
  flag11_binance_api:
    build: ./flag11_binance/exchange
    expose: ["5000"]
    restart: unless-stopped
    networks:
      - titan_net
  flag12_tokengate:
    build: ./flag12_tokengate
    ports: ["8012:5000"]
    volumes:
      - tokengate_data:/app/data
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.22

volumes:
  tokengate_data:

networks:
  titan_net:
    external: true
    name: titan_net
  titan_internal:
    external: true
    name: titan_internal
