# Operation Titan. Docker network 172.28.0.0/24 (change here AND in setup.sh if it clashes with your LAN)
services:
  # --- VPN ---
  openvpn:
    image: kylemanna/openvpn:latest
    container_name: openvpn
    ports:
      - "1194:1194/udp"
    volumes:
      - ./openvpn-data/conf:/etc/openvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.2

  vpn_portal:
    build: ./vpn-portal
    ports:
      - "5050:5050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - openvpn
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.3

  # --- CTFd ---
  db:
    image: mariadb:10.11
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]
    environment:
      - MYSQL_ROOT_PASSWORD=ctfd
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=ctfd
      - MYSQL_DATABASE=ctfd
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - titan_net

  cache:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - titan_net

  ctfd:
    # Pinned on purpose: ctfd-setup talks to the CTFd 3.8.x API/forms.
    image: ctfd/ctfd:3.8.9
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - SECRET_KEY=${SECRET_KEY:-titan_super_secret_key}
    volumes:
      - ctfd_uploads:/var/uploads
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.10

  ctfd_setup:
    build: ./ctfd-setup
    environment:
      - CTFD_URL=http://ctfd:8000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - SERVER_HOST=${PUBLIC_IP:-10.10.15.124}
    depends_on:
      ctfd:
        condition: service_healthy
    restart: on-failure:3
    networks:
      - titan_net

  # --- Challenges ---
  flag1_ssti:
    build: ./flag1_ssti
    ports: ["8001:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.11
  flag2_jwt:
    build: ./flag2_jwt
    ports: ["8002:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.12
  flag3_lfsr:
    build: ./flag3_lfsr
    ports: ["8003:80"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.13
  flag4_pickle:
    build: ./flag4_pickle
    ports: ["8004:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.14
  flag5_jwt_rsa:
    build: ./flag5_jwt_rsa
    ports: ["8005:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.15
  flag6_ecb:
    build: ./flag6_ecb
    ports: ["8006:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.16
  flag7_sqli:
    build: ./flag7_sqli
    ports: ["8007:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.17
  flag8_wiener:
    build: ./flag8_wiener
    ports: ["8008:80"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.18
  flag9_stego:
    build: ./flag9_stego
    ports: ["8009:80"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.19
  flag10_lfi:
    build: ./flag10_lfi
    ports: ["8010:5000"]
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.20
  flag11_binance:
    build: ./flag11_binance/intro
    ports: ["8011:80"]
    depends_on:
      - flag11_binance_api
    restart: unless-stopped
    networks:
      titan_net:
        ipv4_address: 172.28.0.21
  flag11_binance_api:
    build: ./flag11_binance/exchange
    expose: ["5000"]
    restart: unless-stopped
    networks:
      - titan_net

volumes:
  db_data:
  ctfd_uploads:

networks:
  titan_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25   # auto-assigned containers; fixed IPs above never collide
