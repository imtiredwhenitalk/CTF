services:
  web:
    build: .
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      CTF_FLAG: 'CTF{CaN_U_F1ND_Th3_Fl4g?}'
      SECRET_KEY: 'replace-this-for-any-shared-deployment'
      ADMIN_PIN: '4826'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m