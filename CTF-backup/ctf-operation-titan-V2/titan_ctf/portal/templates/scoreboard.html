{% extends "base.html" %}
{% block title %}Скорборд{% endblock %}
{% block content %}
<h2>Скорборд</h2>
<div class="card">
<table>
    <tr><th>#</th><th>Учасник</th><th>Завдань</th><th>Бали</th></tr>
    {% for r in ranked %}
    <tr><td>{{ loop.index }}</td><td>{{ r.name }}</td><td>{{ r.n }}</td><td>{{ r.score }}</td></tr>
    {% else %}
    <tr><td colspan="4" class="muted">Поки що нікого.</td></tr>
    {% endfor %}
</table>
</div>
{% endblock %}
