version: '3.8'

services:
  ctfd:
    image: ctfd/ctfd:latest
    user: root
    ports:
      - "8000:8000"
    environment:
      - ULOGS=/var/log/CTFd
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
    depends_on:
      - db
      - cache
    restart: always

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=ctfd
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=ctfd
      - MYSQL_DATABASE=ctfd
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  cache:
    image: redis:alpine
    restart: always

  flag1_web:
    build: ./challenges/flag1_git_leak
    ports:
      - "8081:80"
    restart: always

  flag2_api:
    build: ./challenges/flag2_jwt_api
    ports:
      - "8082:3000"
    restart: always

  flag4_pwn:
    build: ./challenges/flag4_pwn
    ports:
      - "1337:1337"
    restart: always

  flag5_ad_sim:
    build: ./challenges/flag5_ad_sim
    ports:
      - "8085:5000"
    restart: always

volumes:
  db_data:
